[package]
name = "qcb_taint_count"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace root: never a member of the challenge crate.
[workspace]

[[bin]]
name = "qcb_taint_count"
path = "src/main.rs"

[dependencies]
# Harness library only (circuit, sim, weierstrass_elliptic_curve). No contestant code.
quantum_ecc = { path = "../.." }
# Same version requirements as the challenge Cargo.toml; no new crates.
alloy-primitives = "1.5"
sha3 = "0.10"
zstd = "0.13"

[profile.release]
opt-level = 3
debug = false
